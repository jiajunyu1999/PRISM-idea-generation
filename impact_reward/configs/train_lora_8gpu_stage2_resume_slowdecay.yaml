project: scijudge_reward_v1_8gpu_stage2_resume_slowdecay

model:
  base_model_name: allenai/scibert_scivocab_uncased
  max_length: 512
  pooling: last_token
  use_lora: false

data:
  formatter: paper_raw_v1
  val_ratio: 0.02
  num_workers: 8

train:
  seed: 42
  epochs: 12
  batch_size: 8
  grad_accum_steps: 1
  learning_rate: 5e-6
  weight_decay: 0.01
  warmup_ratio: 0.03
  scheduler_type: cosine
  scheduler_num_cycles: 0.5
  fp16: false
  bf16: false
  gradient_checkpointing: false
  log_every: 100
  eval_every_steps: 2000
  save_every_steps: 2000
  use_data_parallel: false
  save_last_checkpoint: true
  save_best_checkpoint: true
  weighted_start_epoch: 1
  early_stopping:
    enabled: true
    patience: 4
    min_delta: 0.0001

loss:
  name: pairwise_logistic
  weighted: true
  reg_coef: 1e-4
  margin: 1.0

eval:
  dedup_test_pairs: true
  export_error_cases: true
  calibration: sigmoid
