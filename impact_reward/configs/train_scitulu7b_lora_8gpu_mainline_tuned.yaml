project: scitulu7b_reward_lora_8gpu_mainline_tuned

model:
  base_model_name: allenai/scitulu-7b
  max_length: 512
  pooling: last_token
  torch_dtype: bfloat16
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

data:
  formatter: paper_raw_v1
  val_ratio: 0.02
  num_workers: 16

train:
  seed: 42
  epochs: 10
  batch_size: 1
  grad_accum_steps: 8
  learning_rate: 2e-5
  weight_decay: 0.01
  warmup_ratio: 0.02
  scheduler_type: cosine
  scheduler_num_cycles: 0.5
  fp16: false
  bf16: true
  gradient_checkpointing: false
  log_every: 100
  eval_every_steps: 2000
  save_every_steps: 2000
  use_data_parallel: false
  save_last_checkpoint: true
  save_best_checkpoint: true
  weighted_start_epoch: 3
  ddp_static_graph: true
  ddp_find_unused_parameters: false
  early_stopping:
    enabled: false
    patience: 100
    min_delta: 0.0

loss:
  name: pairwise_logistic
  weighted: true
  reg_coef: 5e-4
  margin: 1.0

eval:
  dedup_test_pairs: true
  export_error_cases: true
  calibration: sigmoid
