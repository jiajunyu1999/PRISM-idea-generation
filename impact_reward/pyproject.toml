[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reward-scijudge"
version = "0.1.0"
description = "Single-item reward model pipeline for SciJudgeBench"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1.0",
  "transformers>=4.45.0,<4.52.0",
  "datasets>=2.19.0",
  "accelerate>=0.34.0,<1.0.0",
  "peft>=0.14.0,<0.15.0",
  "pyyaml>=6.0.1",
  "numpy>=1.24.0",
  "scikit-learn>=1.3.0",
  "tqdm>=4.66.0",
  "fastapi>=0.110.0",
  "uvicorn>=0.29.0",
  "pydantic>=2.6.0",
]

[tool.setuptools]
package-dir = {"" = "."}

[tool.setuptools.packages.find]
where = ["."]
include = ["data*", "models*", "train*"]
